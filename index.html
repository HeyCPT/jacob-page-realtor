<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jacob Page — REALTOR® at Halsey Real Estate, serving Benton, Bryant, and Central Arkansas." />
  <title>Jacob Page | REALTOR® | Halsey Real Estate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1A1A1A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .headshot-wrap {
      margin-bottom: 20px;
    }

    .headshot {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 3px solid #B8962E;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .title {
      font-size: 13px;
      color: #B8962E;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brokerage {
      font-size: 14px;
      color: #AAAAAA;
      margin-bottom: 28px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #B8962E;
      margin: 0 auto 28px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
      cursor: pointer;
    }

    .btn:active { opacity: 0.8; }

    .btn-primary {
      background: #B8962E;
      color: #1A1A1A;
    }

    .btn-secondary {
      background: #2C2C2C;
      color: #FFFFFF;
      border: 1px solid #3C3C3C;
    }

    .btn-fb {
      background: #1877F2;
      color: #FFFFFF;
    }

    .icon { font-size: 18px; }

    .save-contact {
      margin-top: 4px;
      margin-bottom: 24px;
    }

    .save-contact a {
      color: #B8962E;
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .areas {
      font-size: 12px;
      color: #888888;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .eho {
      font-size: 11px;
      color: #555555;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="headshot-wrap">
      <img class="headshot" src="headshot.jpg" alt="Jacob Page" />
    </div>

    <div class="name">Jacob Page</div>
    <div class="title">REALTOR®</div>
    <div class="brokerage">Halsey Real Estate &mdash; Benton, AR</div>

    <div class="divider"></div>

    <div class="buttons">
      <a class="btn btn-primary" href="tel:+15017949566">
        <span class="icon">📞</span> Call (501) 794-9566
      </a>
      <a class="btn btn-secondary" href="sms:+15017949566">
        <span class="icon">💬</span> Send a Text
      </a>
      <a class="btn btn-secondary" href="mailto:jacob@halseyre.com">
        <span class="icon">✉️</span> jacob@halseyre.com
      </a>
      <a class="btn btn-fb" href="https://www.facebook.com/profile.php?id=61577432034906" target="_blank" rel="noopener">
        <span class="icon">f</span> Follow on Facebook
      </a>
    </div>

    <div class="save-contact">
      <a href="jacob-page.vcf">⬇ Save Contact to Phone</a>
    </div>

    <div class="areas">
      Serving Benton &bull; Bryant &bull; Little Rock &bull; Central Arkansas
    </div>

    <div class="eho">Equal Housing Opportunity &bull; License SA00099484</div>

  </div>
</body>
</html>
